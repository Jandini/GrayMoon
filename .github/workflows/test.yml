name: Test

on:
  push:
    branches: ["*"]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore GrayMoon.slnx

      # GitVersion runs once here instead of per project: GitVersion.MsBuild in the App and the Worker building in
      # parallel race on its named mutex on Linux ("cannot open the device or file specified").
      - name: Compute version
        id: gitversion
        run: |
          VERSION=$(dotnet gitversion /nofetch /verbosity quiet /showvariable InformationalVersion)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        run: dotnet build GrayMoon.slnx --configuration Release --no-restore -p:Version=${{ steps.gitversion.outputs.version }} -p:DisableGitVersionTask=true

      # Tests marked [Trait("Category", "Long")] (scale and stress tests) run only for a pull request, so a PR gets
      # them once and pushes, tags and manual runs stay fast. A pull request still runs the whole suite.
      - name: Test
        run: |
          FILTER=()
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            FILTER=(--filter "Category!=Long")
          fi
          dotnet test GrayMoon.slnx --configuration Release --no-build "${FILTER[@]}" --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ github.run_number }}
          path: "**/*.trx"
          retention-days: 7

  # The Worker is published as a Native AOT exe. The unit tests above run on the normal runtime and cannot show that
  # the exe works, so this job publishes it and tests it: the first script compares the in-process Git reads
  # (GrayMoon.LibGit2Sharp) between the two runtimes, the second starts the exe against a hub and sends commands.
  # Native AOT cannot be compiled for another operating system, so this needs a Windows runner (MSVC linker).
  worker-aot:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: LibGit2Sharp gives the same answers as Native AOT
        shell: pwsh
        run: ./dev/Test-LibGit2SharpAot.ps1 -WorkDir "${{ runner.temp }}\libgit2-aot"

      - name: The Native AOT Worker connects and answers commands
        shell: pwsh
        run: ./dev/Test-WorkerAot.ps1 -WorkDir "${{ runner.temp }}\worker-aot"
