name: Docker Build

on:
  push:
    tags: ["*"]
  workflow_dispatch:

env:
  # Auto-runs are tag-only; push to Docker Hub only for those tag pushes.
  # workflow_dispatch (any branch) builds without publishing.
  push-to-registry: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Determine version
        id: gitversion
        run: |
          VERSION=$(dotnet gitversion /nofetch /verbosity quiet /showvariable InformationalVersion)
          echo "SemVer=$VERSION" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        if: env.push-to-registry == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ env.push-to-registry == 'true' }}
          build-args: |
            VERSION=${{ steps.gitversion.outputs.SemVer }}
          # Only the git tag named "latest" is published as :latest.
          # Every other tag is published under its version tag alone.
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/graymoon:${{ steps.gitversion.outputs.SemVer }}
            ${{ github.event_name == 'push' && github.ref == 'refs/tags/latest' && format('{0}/graymoon:latest', secrets.DOCKERHUB_USERNAME) || '' }}
