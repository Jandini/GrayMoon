name: Docker Build

on:
  push:
    tags: ["*"]
  workflow_dispatch:

env:
  # Auto-runs are tag-only; push to Docker Hub only for those tag pushes.
  # workflow_dispatch (any branch) builds without publishing.
  push-to-registry: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}

jobs:
  # The Worker is a Native AOT exe, and the Windows one cannot be compiled on Linux. This job builds it on Windows;
  # the build job copies the zip into the image build (see the Dockerfile).
  worker-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore dotnet tools
        run: dotnet tool restore

      # The same command as in the build job: the App accepts only a Worker of its own version.
      - name: Determine version
        id: gitversion
        shell: pwsh
        run: |
          $version = dotnet gitversion /nofetch /verbosity quiet /showvariable InformationalVersion
          if (-not $version) { throw 'GitVersion returned no version.' }
          "SemVer=$version" >> $env:GITHUB_OUTPUT

      - name: Build the Windows Worker zip
        shell: pwsh
        run: ./dev/Build-WindowsWorkerZip.ps1 -Version "${{ steps.gitversion.outputs.SemVer }}"

      - name: Upload the Windows Worker zip
        uses: actions/upload-artifact@v7
        with:
          name: worker-windows
          path: worker-dist/graymoon-worker-windows.zip
          if-no-files-found: error
          retention-days: 1

  build:
    needs: worker-windows
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      # An image is published only after the Test workflow passed for this tag. Test starts from the same tag push,
      # so this waits for that run instead of testing again. When Test failed, rerun it, then rerun this job.
      - name: Wait for tests
        if: env.push-to-registry == 'true'
        timeout-minutes: 45
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          RUNS="repos/${{ github.repository }}/actions/workflows/test.yml/runs?head_sha=${{ github.sha }}&event=push&per_page=100"
          # head_branch is the tag name for a tag push; the same commit can also have runs for a branch or another tag.
          NEWEST='[.workflow_runs[] | select(.head_branch == env.TAG)] | sort_by(.created_at) | last // empty | "\(.status) \(.conclusion // "none") \(.html_url)"'

          while true; do
            # No run listed yet, or a request that fails, means "not yet". The step timeout ends the wait.
            if ! RUN=$(gh api "$RUNS" --jq "$NEWEST"); then
              RUN=""
            fi
            read -r STATUS CONCLUSION URL <<< "$RUN" || true

            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo "Tests passed: $URL"
                exit 0
              fi
              echo "::error::Tests did not pass for tag '$TAG' ($CONCLUSION), so no image is published: $URL"
              exit 1
            fi

            echo "Waiting for the Test run of tag '$TAG' (${STATUS:-not listed yet})."
            sleep 20
          done

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Determine version
        id: gitversion
        run: |
          VERSION=$(dotnet gitversion /nofetch /verbosity quiet /showvariable InformationalVersion)
          echo "SemVer=$VERSION" >> $GITHUB_OUTPUT

      - name: Download the Windows Worker zip
        uses: actions/download-artifact@v7
        with:
          name: worker-windows
          path: worker-dist

      - name: Log in to Docker Hub
        if: env.push-to-registry == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ env.push-to-registry == 'true' }}
          build-args: |
            VERSION=${{ steps.gitversion.outputs.SemVer }}
          # Only the git tag named "latest" is published as :latest.
          # Every other tag is published under its version tag alone.
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/graymoon:${{ steps.gitversion.outputs.SemVer }}
            ${{ github.event_name == 'push' && github.ref == 'refs/tags/latest' && format('{0}/graymoon:latest', secrets.DOCKERHUB_USERNAME) || '' }}
